<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- C: the whole alpaca, standing, as one silhouette. -->
  <rect width="800" height="800" fill="#0e7a5f"/>
  <g fill="#f6f1e7">
    <!-- body -->
    <rect x="236" y="430" width="300" height="140" rx="70"/>
    <!-- wool along the back -->
    <circle cx="270" cy="440" r="34"/><circle cx="324" cy="426" r="34"/><circle cx="378" cy="424" r="34"/>
    <circle cx="432" cy="426" r="34"/><circle cx="244" cy="482" r="30"/>
    <!-- legs -->
    <rect x="256" y="520" width="38" height="170" rx="16"/><rect x="316" y="530" width="38" height="160" rx="16"/>
    <rect x="430" y="530" width="38" height="160" rx="16"/><rect x="488" y="520" width="38" height="170" rx="16"/>
    <!-- neck -->
    <path d="M462 470 L462 250 Q462 214 498 214 L522 214 Q540 214 540 240 L540 480 Z"/>
    <circle cx="460" cy="300" r="26"/><circle cx="458" cy="350" r="26"/><circle cx="456" cy="400" r="26"/>
    <!-- head -->
    <rect x="462" y="190" width="150" height="74" rx="37"/>
    <circle cx="478" cy="192" r="28"/><circle cx="512" cy="178" r="26"/>
    <!-- ears -->
    <path d="M486 172 C478 146 480 116 492 92 C506 116 510 146 506 170 Z"/>
    <path d="M512 168 C510 140 518 112 534 92 C542 120 538 148 528 170 Z"/>
    <!-- tail -->
    <circle cx="226" cy="462" r="22"/>
  </g>
  <circle cx="556" cy="218" r="9" fill="#0e7a5f"/>
  <path d="M608 242 Q598 250 588 247" fill="none" stroke="#0e7a5f" stroke-width="6" stroke-linecap="round"/>
</svg>
