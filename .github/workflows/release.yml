name: Release

# Pushing a tag such as v0.4.0 builds the release files and attaches them to a GitHub release:
# the Chrome extension, the add-cues skill for claude.ai and the Claude app, and the bridge as a
# Claude desktop extension. The Chrome Web Store upload stays a manual step.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Build the extension
        working-directory: extension
        run: |
          npm ci
          npm run check
          npm run build
      - name: Package
        run: |
          mkdir -p release
          (cd extension/.output/chrome-mv3 && zip -qr ../../../release/pagecue-extension.zip .)
          # claude.ai wants the skill's folder at the root of the zip, named like the skill.
          (cd plugins/pagecue/skills && zip -qr ../../../release/pagecue-skill.zip add-cues)
          node plugins/pagecue/scripts/pack-desktop-extension.mjs release/pagecue.mcpb
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v {on=1; next} /^## / && on {exit} on' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.mcpb --title "pagecue $GITHUB_REF_NAME" --notes "${notes:-See CHANGELOG.md}"
